<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1080px;
    height: 1350px;
    font-family: 'Inter', Arial, sans-serif;
    background: #FF5A36;
    color: #0F0F0F;
    position: relative;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .content {
    text-align: center;
    padding: 0 100px;
  }
  .titolo {
    font-size: 88px;
    font-weight: 800;
    letter-spacing: -1px;
    line-height: 1.1;
    margin-bottom: 32px;
    text-wrap: balance;
  }
  .azione {
    font-size: 44px;
    font-weight: 400;
    line-height: 1.4;
  }
  .badge {
    display: inline-block;
    margin-top: 48px;
    background: #0F0F0F;
    color: #FFFFFF;
    font-size: 36px;
    font-weight: 800;
    padding: 24px 48px;
    border-radius: 100px;
  }
</style>
</head>
<body>
  <div class="content">
    <div class="titolo">{{TITOLO}}</div>
    <div class="azione">{{TESTO}}</div>
    <div class="badge">{{CTA_LABEL}}</div>
  </div>
</body>
</html>
