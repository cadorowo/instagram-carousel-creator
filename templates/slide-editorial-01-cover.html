<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=Playfair+Display:ital,wght@0,600;0,700;1,400&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1080px;
    height: 1350px;
    font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    color: #FFFFFF;
    position: relative;
    overflow: hidden;
    background: #111410;
  }
  .bg-img {
    position: absolute;
    top: 0; left: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
  }
  .overlay {
    position: absolute;
    inset: 0;
    background: linear-gradient(135deg, rgba(15, 20, 15, 0.75) 0%, rgba(15, 20, 15, 0.4) 50%, rgba(15, 20, 15, 0.6) 100%);
  }
  .counter {
    position: absolute;
    top: 60px;
    left: 70px;
    font-size: 32px;
    font-weight: 700;
    color: #E8BA3E;
    letter-spacing: 1px;
    border-bottom: 2px solid #E8BA3E;
    padding-bottom: 4px;
  }
  .content {
    position: absolute;
    left: 70px;
    right: 280px;
    top: 240px;
    z-index: 2;
  }
  .titolo {
    font-size: 88px;
    font-weight: 800;
    color: #E8BA3E;
    line-height: 1.05;
    letter-spacing: -1.5px;
    text-wrap: balance;
    margin-bottom: 28px;
    text-transform: lowercase;
  }
  .testo {
    font-size: 36px;
    font-weight: 400;
    color: #E8E4DF;
    line-height: 1.45;
    text-wrap: balance;
  }
  .logo-badge {
    position: absolute;
    bottom: 60px;
    left: 70px;
    display: flex;
    align-items: center;
    gap: 16px;
    z-index: 2;
  }
  .logo-arch {
    width: 64px;
    height: 90px;
    border: 2px solid #E8BA3E;
    border-radius: 40px 40px 0 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-end;
    padding-bottom: 12px;
  }
  .logo-arch svg {
    fill: #E8BA3E;
    width: 28px;
    height: 28px;
  }
  .logo-text {
    font-size: 26px;
    font-weight: 700;
    color: #E8BA3E;
    line-height: 1.1;
  }
  .swipe-hint {
    position: absolute;
    bottom: 70px;
    right: 70px;
    font-size: 30px;
    color: #E8E4DF;
    font-weight: 600;
    z-index: 2;
  }
</style>
</head>
<body>
  <img class="bg-img" src="{{IMMAGINE}}" alt="">
  <div class="overlay"></div>
  <div class="counter">{{NUMERO_SLIDE}}</div>
  <div class="content">
    <div class="titolo">{{TITOLO}}</div>
    <div class="testo">{{TESTO}}</div>
  </div>
  <div class="logo-badge">
    <div class="logo-arch">
      <svg viewBox="0 0 24 24"><path d="M12 2L15 8H9L12 2ZM12 9C15.31 9 18 11.69 18 15V22H6V15C6 11.69 8.69 9 12 9Z"/></svg>
    </div>
    <div class="logo-text">{{NOME_BRAND}}</div>
  </div>
  <div class="swipe-hint">scorri &rarr;</div>
</body>
</html>
