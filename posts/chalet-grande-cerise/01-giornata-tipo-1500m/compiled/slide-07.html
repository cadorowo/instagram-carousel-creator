<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Playfair+Display:ital,wght@0,600;0,700;1,400&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1080px;
    height: 1350px;
    font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    color: #382A24;
    position: relative;
    overflow: hidden;
    background: #EFE3D3;
    padding: 70px;
  }
  .counter {
    position: absolute;
    top: 60px;
    left: 70px;
    font-size: 32px;
    font-weight: 700;
    color: #86382C;
    letter-spacing: 1px;
    border-bottom: 2px solid #86382C;
    padding-bottom: 4px;
  }
  .image-card {
    position: absolute;
    top: 140px;
    right: 70px;
    width: 580px;
    height: 1070px;
    border-radius: 24px;
    overflow: hidden;
    box-shadow: 0 20px 45px rgba(56, 42, 36, 0.18);
  }
  .image-card img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }
  .content {
    position: absolute;
    left: 70px;
    right: 680px;
    top: 380px;
  }
  .titolo {
    font-family: 'Playfair Display', serif;
    font-size: 76px;
    font-weight: 700;
    color: #86382C;
    line-height: 1.1;
    letter-spacing: -1.5px;
    text-wrap: balance;
    margin-bottom: 30px;
    text-transform: lowercase;
  }
  .testo {
    font-size: 34px;
    font-weight: 500;
    color: #382A24;
    line-height: 1.48;
    text-wrap: balance;
  }
</style>
</head>
<body>
  <div class="counter">07</div>
  <div class="content">
    <div class="titolo">20:30 — storie a tavola.</div>
    <div class="testo">La cucina attrezzata è pronta per cene autentiche in compagnia.</div>
  </div>
  <div class="image-card">
    <img src="../03-immagini/cucina.jpeg" alt="Cucina autentica reale">
  </div>
</body>
</html>
