<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Playfair+Display:ital,wght@0,600;0,700;1,400&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1080px;
    height: 1350px;
    font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    color: #382A24;
    position: relative;
    overflow: hidden;
    background: #F3E8DC;
  }
  .bg-img {
    position: absolute;
    top: 0; left: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
  }
  .overlay {
    position: absolute;
    inset: 0;
    background: linear-gradient(to right, rgba(243, 232, 220, 0.96) 0%, rgba(243, 232, 220, 0.74) 55%, rgba(243, 232, 220, 0.22) 100%);
  }
  .counter {
    position: absolute;
    top: 60px;
    left: 70px;
    font-size: 32px;
    font-weight: 700;
    color: #86382C;
    letter-spacing: 1px;
    border-bottom: 2px solid #86382C;
    padding-bottom: 4px;
    z-index: 2;
  }
  .content {
    position: absolute;
    left: 70px;
    right: 320px;
    top: 380px;
    z-index: 2;
  }
  .titolo {
    font-family: 'Playfair Display', serif;
    font-size: 84px;
    font-weight: 700;
    color: #86382C;
    line-height: 1.08;
    letter-spacing: -1.5px;
    text-wrap: balance;
    margin-bottom: 32px;
    text-transform: lowercase;
  }
  .testo {
    font-size: 36px;
    font-weight: 500;
    color: #382A24;
    line-height: 1.45;
    text-wrap: balance;
  }
</style>
</head>
<body>
  <img class="bg-img" src="../03-immagini/chalet-grande-cerise-inverno-neve.avif" alt="Chalet innevato reale">
  <div class="overlay"></div>
  <div class="counter">03</div>
  <div class="content">
    <div class="titolo">09:30 — a 4km dalle piste.</div>
    <div class="testo">Bastano pochi minuti per raggiungere il comprensorio sciistico e i sentieri di Pila.</div>
  </div>
</body>
</html>
