<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Playfair+Display:ital,wght@0,600;0,700;1,400&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1080px;
    height: 1350px;
    font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #EFE3D3;
    color: #382A24;
    padding: 70px 75px;
    position: relative;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }

  /* Header Section */
  .top-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 2px solid rgba(134, 56, 44, 0.2);
    padding-bottom: 20px;
  }
  .tag-label {
    font-size: 24px;
    font-weight: 700;
    color: #86382C;
    letter-spacing: 2px;
    text-transform: uppercase;
  }
  .counter {
    font-size: 26px;
    font-weight: 700;
    color: #86382C;
  }

  /* Arch Window Photo Area */
  .arch-container {
    position: relative;
    width: 100%;
    height: 680px;
    margin: 24px 0 20px 0;
  }
  .arch-window {
    width: 100%;
    height: 100%;
    border-radius: 460px 460px 36px 36px;
    overflow: hidden;
    box-shadow: 0 20px 45px rgba(56, 42, 36, 0.15);
    border: 4px solid #F3E8DC;
  }
  .arch-window img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  /* Floating Stat Badges */
  .floating-badges {
    position: absolute;
    bottom: -18px;
    left: 40px;
    right: 40px;
    display: flex;
    justify-content: center;
    gap: 16px;
    z-index: 2;
  }
  .badge-chip {
    background: #86382C;
    color: #F3E8DC;
    padding: 14px 28px;
    border-radius: 100px;
    font-size: 22px;
    font-weight: 700;
    box-shadow: 0 10px 25px rgba(134, 56, 44, 0.35);
    display: flex;
    align-items: center;
    gap: 10px;
    border: 2px solid #F3E8DC;
  }

  /* Bottom Content Card */
  .bottom-content {
    margin-top: 15px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .titolo {
    font-family: 'Playfair Display', serif;
    font-size: 64px;
    font-weight: 700;
    line-height: 1.1;
    letter-spacing: -1.5px;
    color: #86382C;
    text-wrap: balance;
  }
  .testo {
    font-size: 30px;
    font-weight: 500;
    color: #382A24;
    line-height: 1.45;
    text-wrap: balance;
  }

  /* Footer */
  .footer-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-top: 2px solid rgba(134, 56, 44, 0.2);
    padding-top: 18px;
    font-size: 22px;
    font-weight: 600;
    color: #86382C;
  }
</style>
</head>
<body>

  <!-- Top Bar -->
  <div class="top-bar">
    <div class="tag-label">Living & Panorami • Pila</div>
    <div class="counter">01 / 01</div>
  </div>

  <!-- Central Arch Window -->
  <div class="arch-container">
    <div class="arch-window">
      <img src="../03-immagini/chalet-grande-cerise-tramonto.avif" alt="Tramonto sulle Alpi">
    </div>
    <div class="floating-badges">
      <div class="badge-chip">📍 1500m Quota</div>
      <div class="badge-chip">🪵 150mq Living</div>
      <div class="badge-chip">🏔️ Vista 4000</div>
    </div>
  </div>

  <!-- Bottom Content -->
  <div class="bottom-content">
    <div class="titolo">la finestra sul cuore delle alpi.</div>
    <div class="testo">La conca di Aosta si apre sotto di te mentre il sole illumina le vette innevate.</div>
  </div>

  <!-- Footer Bar -->
  <div class="footer-bar">
    <div>Chalet Grande Cerise • Valle d'Aosta</div>
    <div>chaletgrandecerise.it &rarr;</div>
  </div>

</body>
</html>
