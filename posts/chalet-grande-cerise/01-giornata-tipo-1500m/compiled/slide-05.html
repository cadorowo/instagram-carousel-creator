<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Playfair+Display:ital,wght@0,600;0,700;1,400&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1080px;
    height: 1350px;
    font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    color: #382A24;
    position: relative;
    overflow: hidden;
    background: #F3E8DC;
  }
  .bg-img {
    position: absolute;
    top: 0; left: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
  }
  .overlay {
    position: absolute;
    inset: 0;
    background: linear-gradient(to top, rgba(243, 232, 220, 0.98) 0%, rgba(243, 232, 220, 0.8) 48%, rgba(243, 232, 220, 0.12) 100%);
  }
  .counter {
    position: absolute;
    top: 60px;
    left: 70px;
    font-size: 32px;
    font-weight: 700;
    color: #86382C;
    letter-spacing: 1px;
    border-bottom: 2px solid #86382C;
    padding-bottom: 4px;
    z-index: 2;
  }
  .content {
    position: absolute;
    left: 70px;
    right: 260px;
    bottom: 90px;
    z-index: 2;
  }
  .titolo {
    font-family: 'Playfair Display', serif;
    font-size: 82px;
    font-weight: 700;
    color: #86382C;
    line-height: 1.08;
    letter-spacing: -1.5px;
    text-wrap: balance;
    margin-bottom: 28px;
    text-transform: lowercase;
  }
  .testo {
    font-size: 36px;
    font-weight: 500;
    color: #382A24;
    line-height: 1.45;
    text-wrap: balance;
  }
</style>
</head>
<body>
  <img class="bg-img" src="../03-immagini/camera-patronale.jpeg" alt="Interni accoglienti reali">
  <div class="overlay"></div>
  <div class="counter">05</div>
  <div class="content">
    <div class="titolo">16:30 — rientro al nido.</div>
    <div class="testo">150mq tutti per te. Togliere gli scarponi e immergersi nel calore del legno.</div>
  </div>
</body>
</html>
