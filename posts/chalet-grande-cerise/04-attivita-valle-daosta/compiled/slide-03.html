<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1080px;
    height: 1350px;
    font-family: 'Outfit', sans-serif;
    background: #F3E8DC;
    padding: 70px;
    position: relative;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }
  .header-meta {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 20px;
  }
  .title {
    font-size: 42px;
    font-weight: 700;
    color: #86382C;
    letter-spacing: -0.5px;
  }
  .counter {
    font-size: 26px;
    font-weight: 700;
    color: #86382C;
  }
  .frame-wrapper {
    width: 100%;
    height: 1080px;
    border-radius: 65px;
    overflow: hidden;
    box-shadow: 0 20px 45px rgba(56, 42, 36, 0.12);
  }
  .frame-wrapper img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }
</style>
</head>
<body>
  <div class="header-meta">
    <div class="title">2. trekking ai laghi glaciali</div>
    <div class="counter">03 / 07</div>
  </div>
  <div class="frame-wrapper">
    <img src="../03-immagini/slide-lago.jpg" alt="Laghi Glaciali">
  </div>
</body>
</html>
