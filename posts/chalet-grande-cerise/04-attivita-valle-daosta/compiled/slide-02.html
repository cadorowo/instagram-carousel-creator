<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1080px;
    height: 1350px;
    font-family: 'Outfit', sans-serif;
    background: #F3E8DC;
    color: #382A24;
    padding: 90px 80px;
    position: relative;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }
  .counter {
    font-size: 26px;
    font-weight: 700;
    color: #86382C;
    margin-bottom: 20px;
  }
  .header-headline {
    font-size: 84px;
    font-weight: 700;
    line-height: 1.05;
    letter-spacing: -2px;
    color: #86382C;
    max-width: 900px;
    text-wrap: balance;
  }
  .bottom-content-area {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    gap: 40px;
  }
  .body-copy {
    font-family: 'Plus Jakarta Sans', sans-serif;
    font-size: 34px;
    font-weight: 500;
    line-height: 1.48;
    color: #382A24;
    max-width: 480px;
    text-wrap: balance;
  }
  .mini-thumbnail-box {
    width: 380px;
    height: 480px;
    border-radius: 50px;
    overflow: hidden;
    box-shadow: 0 15px 35px rgba(56, 42, 36, 0.15);
  }
  .mini-thumbnail-box img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }
</style>
</head>
<body>
  <div>
    <div class="counter">02 / 07</div>
    <div class="header-headline">
      1. trail & e-bike a quota 2000m.
    </div>
  </div>
  <div class="bottom-content-area">
    <div class="body-copy">
      Oltre 130 km di percorsi a Pila Bikeland, a soli 4 km dallo chalet. Adrenalina e panorami sui giganti alpini.
    </div>
    <div class="mini-thumbnail-box">
      <img src="../03-immagini/slide-bike.jpg" alt="Trail in quota">
    </div>
  </div>
</body>
</html>
