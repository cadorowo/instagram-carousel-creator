<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Playfair+Display:ital,wght@0,600;0,700;1,400&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1080px;
    height: 1350px;
    font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    color: #382A24;
    position: relative;
    overflow: hidden;
    background: #EFE3D3;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 0 100px;
  }
  .logo-wrapper {
    margin-bottom: 40px;
  }
  .logo-img {
    height: 180px;
    width: auto;
    object-fit: contain;
    filter: drop-shadow(0 15px 30px rgba(134, 56, 44, 0.15));
  }
  .brand-name {
    font-family: 'Playfair Display', serif;
    font-size: 68px;
    font-weight: 700;
    color: #86382C;
    line-height: 1.08;
    margin-bottom: 18px;
    letter-spacing: -0.5px;
  }
  .tagline {
    font-size: 28px;
    font-weight: 600;
    color: #B55743;
    letter-spacing: 2px;
    margin-bottom: 60px;
    text-transform: uppercase;
  }
  .cta-box {
    font-size: 36px;
    font-weight: 500;
    color: #382A24;
    line-height: 1.5;
    max-width: 680px;
    text-wrap: balance;
  }
  .url-badge {
    margin-top: 50px;
    display: inline-block;
    background: #86382C;
    color: #F3E8DC;
    font-size: 32px;
    font-weight: 700;
    padding: 20px 48px;
    border-radius: 100px;
    box-shadow: 0 12px 30px rgba(134, 56, 44, 0.35);
    letter-spacing: 0.5px;
  }
</style>
</head>
<body>
  <div class="logo-wrapper">
    <img class="logo-img" src="../03-immagini/logo-grande-cerise.png" alt="Logo Ufficiale Chalet Grande Cerise">
  </div>
  <div class="brand-name">Chalet Grande Cerise</div>
  <div class="tagline">pila • valle d'aosta • 1500m</div>
  <div class="cta-box">Vivi la tua vacanza outdoor sulle Alpi. Ideale fino a 6 persone con giardino panoramico. Prenota con il 10% di sconto.</div>
  <div class="url-badge">chaletgrandecerise.it ↗</div>
</body>
</html>
