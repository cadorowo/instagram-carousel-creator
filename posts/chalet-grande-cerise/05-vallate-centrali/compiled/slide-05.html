<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1080px;
    height: 1350px;
    font-family: 'Outfit', sans-serif;
    background: #86382C;
    padding: 70px;
    position: relative;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }
  .top-meta {
    display: flex;
    justify-content: space-between;
    align-items: center;
    color: #F3E8DC;
    font-size: 32px;
    font-weight: 700;
    margin-bottom: 20px;
  }
  .inner-photo-frame {
    width: 100%;
    height: 1100px;
    border-radius: 65px;
    overflow: hidden;
    box-shadow: 0 20px 45px rgba(0, 0, 0, 0.25);
  }
  .inner-photo-frame img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }
</style>
</head>
<body>
  <div class="top-meta">
    <div>4. il rientro allo chalet grande cerise</div>
    <div>05 / 07</div>
  </div>
  <div class="inner-photo-frame">
    <img src="../03-immagini/salotto-interno.jpeg" alt="Interni salotto chalet reale">
  </div>
</body>
</html>
