<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1080px;
    height: 1350px;
    font-family: 'Outfit', sans-serif;
    position: relative;
    overflow: hidden;
    background: #F3E8DC;
  }
  .bg-photo {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
  }
  .scrim-overlay {
    position: absolute;
    inset: 0;
    background: linear-gradient(to top, rgba(56, 42, 36, 0.75) 0%, rgba(134, 56, 44, 0.45) 50%, rgba(56, 42, 36, 0.7) 100%);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 80px;
    text-align: center;
  }
  .counter {
    position: absolute;
    top: 70px;
    right: 80px;
    font-size: 26px;
    font-weight: 700;
    color: #F3E8DC;
  }
  .quote-title {
    font-size: 84px;
    font-weight: 700;
    line-height: 1.08;
    letter-spacing: -2px;
    color: #F3E8DC;
    text-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
    max-width: 820px;
    text-wrap: balance;
    margin-bottom: 24px;
  }
  .quote-sub {
    font-family: 'Plus Jakarta Sans', sans-serif;
    font-size: 34px;
    font-weight: 500;
    color: rgba(243, 232, 220, 0.95);
    letter-spacing: 0.5px;
    line-height: 1.45;
    text-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
    max-width: 750px;
    text-wrap: balance;
  }
</style>
</head>
<body>
  <img class="bg-photo" src="../03-immagini/social-preview.jpg" alt="Aperitivo al tramonto reale">
  <div class="scrim-overlay">
    <div class="counter">06 / 07</div>
    <div class="quote-title">5. il silenzio delle alpi.</div>
    <div class="quote-sub">Un bicchiere di vino nel tuo giardino panoramico privato mentre il sole accende le vette.</div>
  </div>
</body>
</html>
