<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1080px;
    height: 1350px;
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #FF5A36;
    color: #0F0F0F;
    position: relative;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .content {
    text-align: center;
    padding: 0 90px;
  }
  .titolo {
    font-size: 84px;
    font-weight: 800;
    letter-spacing: -1.5px;
    line-height: 1.1;
    margin-bottom: 32px;
    text-wrap: balance;
  }
  .azione {
    font-size: 42px;
    font-weight: 500;
    line-height: 1.4;
    color: rgba(15,15,15,0.85);
  }
  .badge {
    display: inline-block;
    margin-top: 56px;
    background: #0F0F0F;
    color: #FFFFFF;
    font-size: 38px;
    font-weight: 800;
    padding: 24px 54px;
    border-radius: 100px;
    box-shadow: 0 16px 32px rgba(0,0,0,0.25);
  }
</style>
</head>
<body>
  <div class="content">
    <div class="titolo">Non perdere questi framework</div>
    <div class="azione">Salva questo carosello per riscrivere i tuoi ganci prima di pubblicare.</div>
    <div class="badge">Salva il post ↗</div>
  </div>
</body>
</html>
