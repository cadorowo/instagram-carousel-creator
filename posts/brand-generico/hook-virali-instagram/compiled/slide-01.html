<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1080px;
    height: 1350px;
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: linear-gradient(160deg, #0F0F0F 0%, #1a1a1a 100%);
    color: #FFFFFF;
    position: relative;
    overflow: hidden;
  }
  .accent-bar {
    position: absolute;
    top: 0; left: 0;
    width: 14px;
    height: 100%;
    background: #FF5A36;
  }
  .content {
    position: absolute;
    left: 80px;
    right: 80px;
    top: 440px;
  }
  .kicker {
    color: #FF5A36;
    font-size: 32px;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: 2px;
    margin-bottom: 28px;
  }
  .titolo {
    font-size: 96px;
    font-weight: 800;
    line-height: 1.05;
    letter-spacing: -2px;
    text-wrap: balance;
  }
  .sottotitolo {
    margin-top: 36px;
    font-size: 40px;
    font-weight: 400;
    color: #B3B3B3;
    line-height: 1.4;
  }
  .swipe-hint {
    position: absolute;
    bottom: 64px;
    right: 80px;
    font-size: 32px;
    color: #B3B3B3;
    font-weight: 400;
  }
</style>
</head>
<body>
  <div class="accent-bar"></div>
  <div class="content">
    <div class="kicker">COPYWRITING SOCIAL</div>
    <div class="titolo">3 errori che uccidono i tuoi post</div>
    <div class="sottotitolo">E come correggerli per fermare subito lo scroll.</div>
  </div>
  <div class="swipe-hint">Scorri &rarr;</div>
</body>
</html>
