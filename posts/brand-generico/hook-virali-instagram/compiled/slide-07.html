<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1080px;
    height: 1350px;
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #0F0F0F;
    color: #FFFFFF;
    position: relative;
    overflow: hidden;
  }
  .slide-number {
    position: absolute;
    top: 64px;
    left: 80px;
    font-size: 28px;
    color: #FF5A36;
    font-weight: 800;
  }
  .content {
    position: absolute;
    left: 80px;
    right: 80px;
    top: 50%;
    transform: translateY(-50%);
  }
  .titolo {
    font-size: 76px;
    font-weight: 800;
    letter-spacing: -1.5px;
    line-height: 1.1;
    margin-bottom: 44px;
    text-wrap: balance;
  }
  .formula-box {
    background: #1A1A1A;
    border-left: 8px solid #FF5A36;
    padding: 36px 40px;
    border-radius: 0 16px 16px 0;
    font-size: 40px;
    font-weight: 700;
    line-height: 1.4;
    color: #FFFFFF;
    margin-bottom: 32px;
  }
  .testo {
    font-size: 38px;
    font-weight: 400;
    line-height: 1.45;
    color: #B3B3B3;
  }
  .footer-bar {
    position: absolute;
    bottom: 0; left: 0;
    width: 100%;
    height: 8px;
    background: #FF5A36;
  }
</style>
</head>
<body>
  <div class="slide-number">07/08</div>
  <div class="content">
    <div class="titolo">La formula salva-scroll</div>
    <div class="formula-box">[Problema doloroso] +<br>[Risultato chiaro] +<br>[Senza lo sforzo tipico]</div>
    <div class="testo">Applicala subito alla copertina del tuo prossimo contenuto.</div>
  </div>
  <div class="footer-bar"></div>
</body>
</html>
