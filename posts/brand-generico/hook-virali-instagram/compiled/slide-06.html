<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1080px;
    height: 1350px;
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #0F0F0F;
    color: #FFFFFF;
    position: relative;
    overflow: hidden;
  }
  .slide-number {
    position: absolute;
    top: 64px;
    left: 80px;
    font-size: 28px;
    color: #FF5A36;
    font-weight: 800;
  }
  .content {
    position: absolute;
    left: 80px;
    right: 80px;
    top: 50%;
    transform: translateY(-50%);
  }
  .titolo {
    font-size: 76px;
    font-weight: 800;
    letter-spacing: -1.5px;
    line-height: 1.1;
    margin-bottom: 44px;
    text-wrap: balance;
  }
  .testo {
    font-size: 42px;
    font-weight: 400;
    line-height: 1.45;
    color: #B3B3B3;
  }
  .footer-bar {
    position: absolute;
    bottom: 0; left: 0;
    width: 100%;
    height: 8px;
    background: #FF5A36;
  }
</style>
</head>
<body>
  <div class="slide-number">06/08</div>
  <div class="content">
    <div class="titolo">La regola d'oro dell'hook</div>
    <div class="testo">Un gancio efficace non riassume il post. Crea una domanda aperta nella mente dell'utente a cui deve trovare risposta.</div>
  </div>
  <div class="footer-bar"></div>
</body>
</html>
