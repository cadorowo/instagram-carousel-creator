<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1080px;
    height: 1350px;
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #0F0F0F;
    color: #FFFFFF;
    position: relative;
    overflow: hidden;
  }
  .image-wrap {
    width: 100%;
    height: 760px;
    overflow: hidden;
    position: relative;
  }
  .image-wrap img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }
  .image-wrap::after {
    content: '';
    position: absolute;
    bottom: 0; left: 0; right: 0;
    height: 220px;
    background: linear-gradient(to bottom, rgba(15,15,15,0) 0%, #0F0F0F 100%);
  }
  .content {
    position: absolute;
    left: 80px;
    right: 80px;
    top: 800px;
  }
  .titolo {
    font-size: 64px;
    font-weight: 800;
    letter-spacing: -1px;
    line-height: 1.15;
    margin-bottom: 24px;
    text-wrap: balance;
  }
  .testo {
    font-size: 40px;
    font-weight: 400;
    line-height: 1.45;
    color: #B3B3B3;
  }
  .slide-number {
    position: absolute;
    top: 48px;
    left: 48px;
    font-size: 28px;
    color: #FFFFFF;
    font-weight: 800;
    background: rgba(0,0,0,0.6);
    backdrop-filter: blur(10px);
    padding: 8px 22px;
    border-radius: 100px;
    border: 1px solid rgba(255,255,255,0.1);
  }
</style>
</head>
<body>
  <div class="image-wrap">
    <img src="../03-immagini/slide-05.jpg" alt="Bersaglio chiaro">
  </div>
  <div class="slide-number">05/08</div>
  <div class="content">
    <div class="titolo">3. Nessun beneficio promesso</div>
    <div class="testo">L'utente pensa: 'Cosa ci guadagno?'. Dichiara subito il risultato concreto o la trasformazione promessa nel post.</div>
  </div>
</body>
</html>
