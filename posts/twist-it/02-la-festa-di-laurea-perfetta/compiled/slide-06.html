<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800;900&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1080px;
    height: 1350px;
    background: #FDFBF4;
    color: #141414;
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    position: relative;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    padding: 70px 78px 60px;
  }
  .label {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 26px;
    font-weight: 500;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: #5C5648;
    margin-bottom: 20px;
  }
  .number-zone {
    display: flex;
    align-items: center;
    justify-content: center;
    border-top: 4px solid #141414;
    border-bottom: 4px solid #141414;
    padding: 54px 0;
  }
  .numero {
    font-family: 'Playfair Display', serif;
    font-weight: 900;
    font-size: 300px;
    line-height: 1;
    letter-spacing: -0.03em;
    color: #141414;
  }
  .testo {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 30px;
    padding: 44px 0 0;
  }
  .corpo {
    font-size: 44px;
    font-weight: 400;
    line-height: 1.45;
    text-wrap: balance;
    color: #141414;
  }
  .corpo strong {
    font-weight: 700;
  }
  .annotazione {
    font-family: 'Playfair Display', serif;
    font-weight: 900;
    font-size: 40px;
    line-height: 1.3;
    color: #FD6C12;
    text-wrap: balance;
  }
  .footer {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    border-top: 3px solid #141414;
    padding-top: 22px;
  }
  .counter {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 22px;
    font-weight: 500;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: #5C5648;
  }
  .swipe {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 22px;
    font-weight: 500;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: #5C5648;
  }
</style>
</head>
<body>
  <div class="label">IL RISULTATO ALLA FESTA</div>
  <div class="number-zone">
    <div class="numero">0</div>
  </div>
  <div class="testo">
    <div class="corpo"><strong>Zero telefoni sul tavolo</strong> e 2 ore di risate, accuse reciproche e brindisi continui tra tutti gli invitati.</div>
    <div class="annotazione">(carta vera, dinamica reale, festa leggendaria)</div>
  </div>
  <div class="footer">
    <div class="counter">06 / 07</div>
    <div class="swipe">scorri &rarr;</div>
  </div>
</body>
</html>
