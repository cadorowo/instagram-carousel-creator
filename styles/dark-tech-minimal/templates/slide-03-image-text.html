<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1080px;
    height: 1350px;
    font-family: 'Inter', Arial, sans-serif;
    background: #0F0F0F;
    color: #FFFFFF;
    position: relative;
    overflow: hidden;
  }
  .image-wrap {
    width: 100%;
    height: 760px;
    overflow: hidden;
    position: relative;
  }
  .image-wrap img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }
  .image-wrap::after {
    content: '';
    position: absolute;
    bottom: 0; left: 0; right: 0;
    height: 200px;
    background: linear-gradient(to bottom, rgba(15,15,15,0) 0%, #0F0F0F 100%);
  }
  .content {
    position: absolute;
    left: 80px;
    right: 80px;
    top: 820px;
  }
  .titolo {
    font-size: 60px;
    font-weight: 800;
    letter-spacing: -1px;
    line-height: 1.1;
    margin-bottom: 24px;
    text-wrap: balance;
  }
  .testo {
    font-size: 38px;
    font-weight: 400;
    line-height: 1.4;
    color: #B3B3B3;
  }
  .slide-number {
    position: absolute;
    top: 48px;
    left: 48px;
    font-size: 28px;
    color: #FFFFFF;
    font-weight: 800;
    background: rgba(0,0,0,0.5);
    padding: 8px 20px;
    border-radius: 100px;
  }
</style>
</head>
<body>
  <div class="image-wrap">
    <img src="{{IMMAGINE}}" alt="">
  </div>
  <div class="slide-number">{{NUMERO_SLIDE}}</div>
  <div class="content">
    <div class="titolo">{{TITOLO}}</div>
    <div class="testo">{{TESTO}}</div>
  </div>
</body>
</html>
