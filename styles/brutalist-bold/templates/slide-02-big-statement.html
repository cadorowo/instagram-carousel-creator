<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@800&family=Space+Mono:wght@700&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1080px;
    height: 1350px;
    font-family: 'Plus Jakarta Sans', sans-serif;
    background: #0A0A0A;
    color: #F3F3F3;
    padding: 80px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    position: relative;
    border: 12px solid #E8FE46;
  }
  .header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 4px solid #333333;
    padding-bottom: 24px;
  }
  .tag {
    background: #E8FE46;
    color: #0A0A0A;
    font-family: 'Space Mono', monospace;
    font-size: 24px;
    font-weight: 700;
    padding: 8px 18px;
    text-transform: uppercase;
  }
  .counter {
    font-family: 'Space Mono', monospace;
    font-size: 32px;
    font-weight: 700;
    color: #E8FE46;
  }
  .statement-box {
    margin: auto 0;
  }
  .titolo {
    font-size: 88px;
    font-weight: 800;
    line-height: 1.05;
    letter-spacing: -2px;
    text-transform: uppercase;
    margin-bottom: 36px;
  }
  .highlight-yellow {
    color: #E8FE46;
  }
  .testo {
    font-family: 'Space Mono', monospace;
    font-size: 36px;
    line-height: 1.5;
    color: #CCCCCC;
    max-width: 820px;
  }
  .footer {
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-top: 4px solid #333333;
    padding-top: 24px;
    font-family: 'Space Mono', monospace;
    font-size: 24px;
    font-weight: 700;
    color: #888888;
  }
</style>
</head>
<body>
  <div class="header">
    <div class="tag">{{TAG_CATEGORY}}</div>
    <div class="counter">{{NUMERO_SLIDE}}</div>
  </div>
  <div class="statement-box">
    <div class="titolo">{{TITOLO_START}} <span class="highlight-yellow">{{TITOLO_ACCENT}}</span></div>
    <div class="testo">{{TESTO_CORPO}}</div>
  </div>
  <div class="footer">
    <div>{{BRAND_NAME}}</div>
    <div>SCORRI &rarr;</div>
  </div>
</body>
</html>
