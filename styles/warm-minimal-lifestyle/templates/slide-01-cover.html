<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;0,700;1,400&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1080px;
    height: 1350px;
    font-family: 'Plus Jakarta Sans', sans-serif;
    background: #F6F2EC;
    color: #241E1A;
    padding: 80px;
    position: relative;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }
  .top-meta {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 22px;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: #5C524A;
    border-bottom: 1px solid #D6CEBE;
    padding-bottom: 20px;
  }
  .image-wrapper {
    width: 100%;
    height: 640px;
    margin: 40px 0;
    overflow: hidden;
    box-shadow: 0 15px 35px rgba(36, 30, 26, 0.08);
  }
  .image-wrapper img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }
  .headline-box {
    margin-bottom: 20px;
  }
  .titolo {
    font-family: 'Cormorant Garamond', serif;
    font-size: 84px;
    font-weight: 600;
    line-height: 1.05;
    letter-spacing: -1px;
    color: #241E1A;
    margin-bottom: 18px;
    text-wrap: balance;
  }
  .sottotitolo {
    font-size: 32px;
    font-weight: 400;
    color: #5C524A;
    line-height: 1.45;
    max-width: 800px;
  }
  .bottom-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 22px;
    color: #5C524A;
    letter-spacing: 2px;
    border-top: 1px solid #D6CEBE;
    padding-top: 20px;
  }
</style>
</head>
<body>
  <div class="top-meta">
    <div>{{BRAND_NAME}}</div>
    <div>ISSUE • {{ISSUE_NUM}}</div>
  </div>
  <div class="image-wrapper">
    <img src="{{IMMAGINE}}" alt="">
  </div>
  <div class="headline-box">
    <div class="titolo">{{TITOLO}}</div>
    <div class="sottotitolo">{{SOTTOTITOLO}}</div>
  </div>
  <div class="bottom-bar">
    <div>{{COLLECTION_NAME}}</div>
    <div>SCORRI &rarr;</div>
  </div>
</body>
</html>
