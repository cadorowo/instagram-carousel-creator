<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1080px;
    height: 1350px;
    font-family: 'Outfit', sans-serif;
    position: relative;
    overflow: hidden;
    background: #F0ECE1;
  }
  .bg-photo {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
  }
  .scrim-overlay {
    position: absolute;
    inset: 0;
    background: radial-gradient(circle at center, rgba(43, 37, 33, 0.4) 0%, rgba(43, 37, 33, 0.15) 100%);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 80px;
    text-align: center;
  }
  .quote-title {
    font-size: 88px;
    font-weight: 700;
    line-height: 1.08;
    letter-spacing: -2px;
    color: #FFFFFF;
    text-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
    max-width: 820px;
    text-wrap: balance;
    margin-bottom: 24px;
  }
  .quote-sub {
    font-family: 'Plus Jakarta Sans', sans-serif;
    font-size: 32px;
    font-weight: 500;
    color: rgba(255, 255, 255, 0.9);
    letter-spacing: 1px;
    text-shadow: 0 4px 15px rgba(0, 0, 0, 0.35);
  }
</style>
</head>
<body>
  <img class="bg-photo" src="{{IMMAGINE}}" alt="">
  <div class="scrim-overlay">
    <div class="quote-title">{{TITOLO}}</div>
    <div class="quote-sub">{{SOTTOTITOLO}}</div>
  </div>
</body>
</html>
