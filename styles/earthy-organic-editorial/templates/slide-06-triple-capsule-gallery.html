<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1080px;
    height: 1350px;
    font-family: 'Outfit', sans-serif;
    background: #F0ECE1;
    color: #2B2521;
    padding: 100px 80px 80px 80px;
    position: relative;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }
  .header-section {
    max-width: 850px;
  }
  .titolo {
    font-size: 84px;
    font-weight: 700;
    line-height: 1.08;
    letter-spacing: -2px;
    color: #2B2521;
    margin-bottom: 20px;
    text-wrap: balance;
  }
  .sottotitolo {
    font-family: 'Plus Jakarta Sans', sans-serif;
    font-size: 32px;
    font-weight: 400;
    color: #5C6846;
    line-height: 1.45;
  }
  .capsules-row {
    display: flex;
    gap: 24px;
    height: 620px;
    width: 100%;
  }
  .capsule-item {
    flex: 1;
    height: 100%;
    border-radius: 40px;
    overflow: hidden;
    box-shadow: 0 15px 35px rgba(43, 37, 33, 0.1);
  }
  .capsule-item img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }
</style>
</head>
<body>
  <div class="header-section">
    <div class="titolo">{{TITOLO}}</div>
    <div class="sottotitolo">{{SOTTOTITOLO}}</div>
  </div>
  <div class="capsules-row">
    <div class="capsule-item">
      <img src="{{IMMAGINE_1}}" alt="">
    </div>
    <div class="capsule-item">
      <img src="{{IMMAGINE_2}}" alt="">
    </div>
    <div class="capsule-item">
      <img src="{{IMMAGINE_3}}" alt="">
    </div>
  </div>
</body>
</html>
