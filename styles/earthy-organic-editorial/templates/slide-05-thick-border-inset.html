<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1080px;
    height: 1350px;
    background: #8C5946;
    padding: 80px;
    position: relative;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .inner-photo-frame {
    width: 100%;
    height: 100%;
    border-radius: 65px;
    overflow: hidden;
    box-shadow: 0 20px 45px rgba(0, 0, 0, 0.2);
  }
  .inner-photo-frame img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }
</style>
</head>
<body>
  <div class="inner-photo-frame">
    <img src="{{IMMAGINE}}" alt="">
  </div>
</body>
</html>
