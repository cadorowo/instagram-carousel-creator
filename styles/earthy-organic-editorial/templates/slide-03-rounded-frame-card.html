<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1080px;
    height: 1350px;
    background: #F0ECE1;
    padding: 70px;
    position: relative;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .frame-wrapper {
    width: 100%;
    height: 100%;
    border-radius: 70px;
    overflow: hidden;
    box-shadow: 0 15px 40px rgba(43, 37, 33, 0.08);
  }
  .frame-wrapper img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }
</style>
</head>
<body>
  <div class="frame-wrapper">
    <img src="{{IMMAGINE}}" alt="">
  </div>
</body>
</html>
