<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1080px;
    height: 1350px;
    font-family: 'Outfit', sans-serif;
    background: #F0ECE1;
    color: #2B2521;
    padding: 100px 90px;
    position: relative;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }
  .header-headline {
    font-size: 88px;
    font-weight: 700;
    line-height: 1.05;
    letter-spacing: -2px;
    color: #2B2521;
    max-width: 900px;
    text-wrap: balance;
  }
  .bottom-content-area {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    gap: 40px;
  }
  .body-copy {
    font-family: 'Plus Jakarta Sans', sans-serif;
    font-size: 34px;
    font-weight: 400;
    line-height: 1.5;
    color: #5C6846;
    max-width: 480px;
    text-wrap: balance;
  }
  .mini-thumbnail-box {
    width: 360px;
    height: 420px;
    border-radius: 50px;
    overflow: hidden;
    box-shadow: 0 15px 35px rgba(43, 37, 33, 0.12);
  }
  .mini-thumbnail-box img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }
</style>
</head>
<body>
  <div class="header-headline">
    {{TITOLO}}
  </div>
  <div class="bottom-content-area">
    <div class="body-copy">
      {{TESTO_CORPO}}
    </div>
    <div class="mini-thumbnail-box">
      <img src="{{IMMAGINE_THUMB}}" alt="">
    </div>
  </div>
</body>
</html>
