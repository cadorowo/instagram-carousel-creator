<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1080px;
    height: 1350px;
    font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    color: #FFFFFF;
    position: relative;
    overflow: hidden;
    background: #1B2219;
    padding: 70px;
  }
  .counter {
    position: absolute;
    top: 60px;
    left: 70px;
    font-size: 32px;
    font-weight: 700;
    color: #E8BA3E;
    letter-spacing: 1px;
    border-bottom: 2px solid #E8BA3E;
    padding-bottom: 4px;
  }
  .image-card {
    position: absolute;
    top: 140px;
    right: 70px;
    width: 580px;
    height: 1070px;
    border-radius: 20px;
    overflow: hidden;
    box-shadow: 0 20px 50px rgba(0,0,0,0.5);
  }
  .image-card img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }
  .content {
    position: absolute;
    left: 70px;
    right: 680px;
    top: 380px;
  }
  .titolo {
    font-size: 76px;
    font-weight: 800;
    color: #E8BA3E;
    line-height: 1.1;
    letter-spacing: -1.5px;
    text-wrap: balance;
    margin-bottom: 30px;
    text-transform: lowercase;
  }
  .testo {
    font-size: 34px;
    font-weight: 400;
    color: #E8E4DF;
    line-height: 1.48;
    text-wrap: balance;
  }
</style>
</head>
<body>
  <div class="counter">{{NUMERO_SLIDE}}</div>
  <div class="content">
    <div class="titolo">{{TITOLO}}</div>
    <div class="testo">{{TESTO}}</div>
  </div>
  <div class="image-card">
    <img src="{{IMMAGINE}}" alt="">
  </div>
</body>
</html>
