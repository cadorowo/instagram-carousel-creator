<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Playfair+Display:ital,wght@0,600;0,700;1,400&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1080px;
    height: 1350px;
    font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #EFE3D3;
    color: #382A24;
    padding: 70px 75px;
    position: relative;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }

  /* Header */
  .top-meta {
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 2px solid rgba(134, 56, 44, 0.2);
    padding-bottom: 18px;
  }
  .tag {
    font-size: 24px;
    font-weight: 700;
    color: #86382C;
    letter-spacing: 2px;
    text-transform: uppercase;
  }
  .counter {
    font-size: 26px;
    font-weight: 700;
    color: #86382C;
  }

  /* Duet Gallery */
  .duet-grid {
    display: flex;
    gap: 24px;
    height: 640px;
    margin: 30px 0;
  }
  .duet-main {
    flex: 1.4;
    height: 100%;
    border-radius: 36px;
    overflow: hidden;
    box-shadow: 0 18px 40px rgba(56, 42, 36, 0.14);
    border: 4px solid #F3E8DC;
  }
  .duet-main img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }
  .duet-sidebar {
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 20px;
    height: 100%;
  }
  .duet-thumb {
    flex: 1.2;
    border-radius: 30px;
    overflow: hidden;
    box-shadow: 0 14px 30px rgba(56, 42, 36, 0.12);
    border: 3px solid #F3E8DC;
  }
  .duet-thumb img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }
  .duet-stat-box {
    flex: 0.8;
    background: #86382C;
    color: #F3E8DC;
    border-radius: 30px;
    padding: 24px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    text-align: center;
    box-shadow: 0 14px 30px rgba(134, 56, 44, 0.25);
  }
  .stat-number {
    font-family: 'Playfair Display', serif;
    font-size: 52px;
    font-weight: 700;
    line-height: 1;
    margin-bottom: 8px;
  }
  .stat-label {
    font-size: 20px;
    font-weight: 600;
    letter-spacing: 1px;
    text-transform: uppercase;
    opacity: 0.9;
  }

  /* Content */
  .headline-box {
    margin-top: 10px;
  }
  .titolo {
    font-family: 'Playfair Display', serif;
    font-size: 66px;
    font-weight: 700;
    line-height: 1.1;
    letter-spacing: -1.5px;
    color: #86382C;
    margin-bottom: 14px;
    text-wrap: balance;
  }
  .testo {
    font-size: 32px;
    font-weight: 500;
    color: #382A24;
    line-height: 1.45;
    text-wrap: balance;
  }

  /* Footer */
  .footer-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-top: 2px solid rgba(134, 56, 44, 0.2);
    padding-top: 18px;
    font-size: 22px;
    font-weight: 600;
    color: #86382C;
  }
</style>
</head>
<body>

  <!-- Top Bar -->
  <div class="top-meta">
    <div class="tag">{{TAG_CATEGORY}}</div>
    <div class="counter">{{COUNTER}}</div>
  </div>

  <!-- Duet Photo Grid -->
  <div class="duet-grid">
    <div class="duet-main">
      <img src="{{IMMAGINE_PRINCIPALE}}" alt="">
    </div>
    <div class="duet-sidebar">
      <div class="duet-thumb">
        <img src="{{IMMAGINE_SECONDARIA}}" alt="">
      </div>
      <div class="duet-stat-box">
        <div class="stat-number">{{STAT_VALORE}}</div>
        <div class="stat-label">{{STAT_DESCRIZIONE}}</div>
      </div>
    </div>
  </div>

  <!-- Bottom Headline & Text -->
  <div class="headline-box">
    <div class="titolo">{{TITOLO}}</div>
    <div class="testo">{{TESTO}}</div>
  </div>

  <!-- Footer -->
  <div class="footer-bar">
    <div>{{BRAND_NAME}}</div>
    <div>{{FOOTER_CTA}} &rarr;</div>
  </div>

</body>
</html>
