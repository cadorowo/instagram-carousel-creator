<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800;900&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1080px;
    height: 1350px;
    position: relative;
    overflow: hidden;
    color: #FDFBF4;
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: flex;
    flex-direction: column;
    padding: 70px 78px 60px;
    background: #141414;
  }
  
  /* Immagine di sfondo full bleed */
  .bg-image {
    position: absolute;
    inset: 0;
    width: 1080px;
    height: 1350px;
    object-fit: cover;
    z-index: 1;
  }
  
  /* Layer di trasparenza / overlay scuro goliardico ad alto contrasto */
  .overlay-layer {
    position: absolute;
    inset: 0;
    background: linear-gradient(180deg, rgba(20, 20, 20, 0.60) 0%, rgba(20, 20, 20, 0.82) 65%, rgba(20, 20, 20, 0.95) 100%);
    z-index: 2;
  }

  /* Contenuto posizionato sopra il layer */
  .content {
    position: relative;
    z-index: 3;
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }

  .head {
    display: flex;
    flex-direction: row;
    align-items: center;
    justify-content: space-between;
    border-bottom: 3px solid rgba(253, 251, 244, 0.35);
    padding-bottom: 20px;
  }

  .counter {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 26px;
    font-weight: 500;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: #FFD400;
  }

  .badge {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 20px;
    font-weight: 500;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    background: #FFD400;
    color: #141414;
    border-radius: 999px;
    padding: 10px 24px;
  }

  .card-container {
    background: rgba(20, 20, 20, 0.70);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    border: 4px solid #FFD400;
    border-radius: 28px;
    padding: 56px 54px;
    margin: 40px 0;
    display: flex;
    flex-direction: column;
    gap: 28px;
    box-shadow: 0 16px 36px rgba(0, 0, 0, 0.45);
  }

  .titolo {
    font-family: 'Playfair Display', serif;
    font-weight: 900;
    font-size: 84px;
    line-height: 1.05;
    letter-spacing: -0.02em;
    text-wrap: balance;
    color: #FDFBF4;
  }

  .testo {
    font-size: 40px;
    font-weight: 400;
    line-height: 1.45;
    text-wrap: balance;
    color: #FDFBF4;
  }

  .testo strong {
    font-weight: 700;
    color: #FFD400;
  }

  .annotazione {
    font-family: 'Playfair Display', serif;
    font-weight: 900;
    font-size: 38px;
    line-height: 1.3;
    color: #FD6C12;
    text-wrap: balance;
  }

  .footer {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    border-top: 3px solid rgba(253, 251, 244, 0.35);
    padding-top: 22px;
  }

  .brand {
    font-family: 'Playfair Display', serif;
    font-weight: 900;
    font-size: 38px;
    letter-spacing: -0.02em;
    color: #FFD400;
  }

  .swipe {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 22px;
    font-weight: 500;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: #FDFBF4;
  }
</style>
</head>
<body>
  <!-- Immagine di Sfondo (Feste di Laurea, Compleanni, Amici) -->
  <img class="bg-image" src="{{IMMAGINE}}" alt="">

  <!-- Layer Trasparenza Scuro -->
  <div class="overlay-layer"></div>

  <!-- Contenuto in Sovrimpressione -->
  <div class="content">
    <div class="head">
      <div class="counter">{{CONTATORE}}</div>
      <div class="badge">{{BADGE}}</div>
    </div>

    <div class="card-container">
      <div class="titolo">{{TITOLO}}</div>
      <div class="testo">{{TESTO}}</div>
      <div class="annotazione">{{ANNOTAZIONE}}</div>
    </div>

    <div class="footer">
      <div class="brand">{{NOME_BRAND}}</div>
      <div class="swipe">scorri &rarr;</div>
    </div>
  </div>
</body>
</html>
