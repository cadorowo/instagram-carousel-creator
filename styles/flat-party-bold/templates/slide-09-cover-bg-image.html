<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800;900&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1080px;
    height: 1350px;
    position: relative;
    overflow: hidden;
    color: #FDFBF4;
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: flex;
    flex-direction: column;
    padding: 70px 78px 60px;
    background: #141414;
  }
  
  /* Immagine di sfondo full bleed */
  .bg-image {
    position: absolute;
    inset: 0;
    width: 1080px;
    height: 1350px;
    object-fit: cover;
    z-index: 1;
  }
  
  /* Layer di trasparenza graduato */
  .overlay-layer {
    position: absolute;
    inset: 0;
    background: linear-gradient(180deg, rgba(20, 20, 20, 0.45) 0%, rgba(20, 20, 20, 0.75) 45%, rgba(20, 20, 20, 0.94) 100%);
    z-index: 2;
  }

  /* Contenuto */
  .content {
    position: relative;
    z-index: 3;
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }

  .head {
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 4px solid #FFD400;
    padding-bottom: 16px;
  }

  .counter {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 26px;
    font-weight: 500;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: #FFD400;
  }

  .badge {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 20px;
    font-weight: 500;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    background: #FFD400;
    color: #141414;
    border-radius: 999px;
    padding: 8px 22px;
  }

  .main {
    margin-top: auto;
    margin-bottom: auto;
    padding: 30px 0;
  }

  .titolo {
    font-family: 'Playfair Display', serif;
    font-weight: 900;
    font-size: 102px;
    line-height: 1.02;
    letter-spacing: -0.02em;
    text-wrap: balance;
    color: #FDFBF4;
    max-width: 920px;
  }

  .titolo strong {
    color: #FFD400;
    font-weight: 900;
  }

  .annotazione {
    font-family: 'Playfair Display', serif;
    font-weight: 900;
    font-size: 42px;
    line-height: 1.3;
    color: #FD6C12;
    margin-top: 36px;
    text-wrap: balance;
    max-width: 880px;
  }

  .footer {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    border-top: 4px solid #FFD400;
    padding-top: 24px;
  }

  .brand {
    font-family: 'Playfair Display', serif;
    font-weight: 900;
    font-size: 44px;
    letter-spacing: -0.02em;
    color: #FFD400;
  }

  .swipe {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 24px;
    font-weight: 500;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: #FDFBF4;
  }
</style>
</head>
<body>
  <img class="bg-image" src="{{IMMAGINE}}" alt="">
  <div class="overlay-layer"></div>

  <div class="content">
    <div class="head">
      <div class="counter">{{CONTATORE}}</div>
      <div class="badge">{{BADGE}}</div>
    </div>
    <div class="main">
      <div class="titolo">{{TITOLO}}</div>
      <div class="annotazione">{{ANNOTAZIONE}}</div>
    </div>
    <div class="footer">
      <div class="brand">{{NOME_BRAND}}</div>
      <div class="swipe">scorri &rarr;</div>
    </div>
  </div>
</body>
</html>
