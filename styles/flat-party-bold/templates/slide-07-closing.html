<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800;900&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1080px;
    height: 1350px;
    background: #141414;
    color: #FDFBF4;
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    position: relative;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 70px 100px 60px;
  }
  .brand {
    font-family: 'Playfair Display', serif;
    font-weight: 900;
    font-size: 56px;
    letter-spacing: -0.02em;
    color: #FFD400;
    margin-bottom: 60px;
  }
  .titolo {
    font-family: 'Playfair Display', serif;
    font-weight: 900;
    font-size: 88px;
    line-height: 1.08;
    letter-spacing: -0.02em;
    text-wrap: balance;
    color: #FDFBF4;
    margin-bottom: 32px;
    max-width: 860px;
  }
  .annotazione {
    font-family: 'Playfair Display', serif;
    font-weight: 900;
    font-size: 38px;
    line-height: 1.3;
    color: #FD6C12;
    margin-bottom: 64px;
    text-wrap: balance;
    max-width: 760px;
  }
  .cta {
    min-width: 480px;
    background: #FFD400;
    border-radius: 999px;
    padding: 34px 56px;
    font-family: 'Playfair Display', serif;
    font-weight: 900;
    font-size: 44px;
    letter-spacing: -0.01em;
    color: #141414;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 18px;
    box-shadow: 0 10px 24px rgba(0, 0, 0, 0.35);
  }
  .cta .arrow {
    font-size: 44px;
  }
  .footer {
    display: flex;
    flex-direction: row;
    align-items: center;
    justify-content: space-between;
    align-self: stretch;
    border-top: 3px solid #FFD400;
    margin-top: 84px;
    padding-top: 26px;
  }
  .counter {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 22px;
    font-weight: 500;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: #FFD400;
  }
  .swipe {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 22px;
    font-weight: 500;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: #FFD400;
  }
</style>
</head>
<body>
  <div class="brand">{{NOME_BRAND}}</div>
  <div class="titolo">{{TITOLO}}</div>
  <div class="annotazione">{{ANNOTAZIONE}}</div>
  <div class="cta">{{CTA_TESTO}} <span class="arrow">&rarr;</span></div>
  <div class="footer">
    <div class="counter">{{CONTATORE}}</div>
    <div class="swipe">{{TAGLINE}}</div>
  </div>
</body>
</html>
