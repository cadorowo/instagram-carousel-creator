<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800;900&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1080px;
    height: 1350px;
    background: #FDFBF4;
    color: #141414;
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    position: relative;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    padding: 70px 78px 60px;
  }
  .head {
    display: flex;
    flex-direction: row;
    align-items: baseline;
    justify-content: space-between;
    border-bottom: 4px solid #141414;
    padding-bottom: 20px;
    margin-bottom: 48px;
  }
  .counter {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 26px;
    font-weight: 500;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: #5C5648;
  }
  .badge {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 20px;
    font-weight: 500;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    background: #141414;
    color: #FFD400;
    border-radius: 999px;
    padding: 10px 22px;
  }
  .titolo {
    font-family: 'Playfair Display', serif;
    font-weight: 900;
    font-size: 84px;
    line-height: 1.06;
    letter-spacing: -0.02em;
    text-wrap: balance;
    color: #141414;
    margin-bottom: 44px;
  }
  .rows {
    flex: 1;
    display: flex;
    flex-direction: column;
  }
  .row {
    display: flex;
    flex-direction: row;
    gap: 30px;
    align-items: baseline;
    border-top: 3px solid #141414;
    padding: 30px 0;
  }
  .row:last-child {
    border-bottom: 3px solid #141414;
  }
  .num {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 30px;
    font-weight: 500;
    letter-spacing: 0.08em;
    flex-shrink: 0;
    color: #141414;
  }
  .txt {
    font-size: 40px;
    line-height: 1.4;
    text-wrap: balance;
  }
  .txt strong {
    font-weight: 700;
  }
  .footer {
    display: flex;
    flex-direction: row;
    align-items: flex-end;
    justify-content: space-between;
    padding-top: 36px;
  }
  .annotazione {
    font-family: 'Playfair Display', serif;
    font-weight: 900;
    font-size: 36px;
    line-height: 1.3;
    color: #FD6C12;
    text-wrap: balance;
    max-width: 760px;
  }
  .swipe {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 22px;
    font-weight: 500;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: #5C5648;
    flex-shrink: 0;
  }
</style>
</head>
<body>
  <div class="head">
    <div class="counter">{{CONTATORE}}</div>
    <div class="badge">{{BADGE}}</div>
  </div>
  <div class="titolo">{{TITOLO}}</div>
  <div class="rows">{{LISTA}}</div>
  <div class="footer">
    <div class="annotazione">{{ANNOTAZIONE}}</div>
    <div class="swipe">scorri &rarr;</div>
  </div>
</body>
</html>
