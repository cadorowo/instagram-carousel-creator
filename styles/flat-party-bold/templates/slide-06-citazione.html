<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800;900&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1080px;
    height: 1350px;
    background: #DED7C6;
    color: #141414;
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    position: relative;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    padding: 70px 78px 60px;
  }
  .head {
    display: flex;
    flex-direction: row;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 40px;
  }
  .label {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 24px;
    font-weight: 500;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: #5C5648;
  }
  .action {
    font-size: 22px;
    font-weight: 700;
    text-decoration: underline;
    color: #141414;
  }
  .quote-card {
    flex: 1;
    background: #FDFBF4;
    border: 4px solid #141414;
    border-radius: 28px;
    padding: 52px 54px;
    display: flex;
    flex-direction: column;
    box-shadow: 0 10px 24px rgba(20, 20, 20, 0.16);
  }
  .quote {
    font-family: 'Playfair Display', serif;
    font-weight: 700;
    font-size: 60px;
    line-height: 1.25;
    letter-spacing: -0.01em;
    text-wrap: balance;
    color: #141414;
  }
  .quote strong {
    font-weight: 900;
    text-decoration: underline;
    text-decoration-thickness: 3px;
  }
  .attribution {
    margin-top: auto;
    padding-top: 44px;
  }
  .pill {
    display: inline-flex;
    flex-direction: row;
    align-items: center;
    gap: 18px;
    background: #141414;
    border-radius: 999px;
    padding: 12px 30px 12px 12px;
  }
  .avatar {
    width: 60px;
    height: 60px;
    border-radius: 999px;
    background: #FFD400;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Playfair Display', serif;
    font-weight: 900;
    font-size: 28px;
    color: #141414;
  }
  .name {
    font-size: 26px;
    font-weight: 700;
    color: #FFD400;
  }
  .annotazione {
    font-family: 'Playfair Display', serif;
    font-weight: 900;
    font-size: 34px;
    line-height: 1.3;
    color: #FD6C12;
    margin-top: 28px;
    text-wrap: balance;
  }
  .footer {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    padding-top: 28px;
  }
  .counter {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 22px;
    font-weight: 500;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: #5C5648;
  }
  .swipe {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 22px;
    font-weight: 500;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: #5C5648;
  }
</style>
</head>
<body>
  <div class="head">
    <div class="label">{{LABEL}}</div>
    <div class="action">{{AZIONE}}</div>
  </div>
  <div class="quote-card">
    <div class="quote">{{CITAZIONE}}</div>
    <div class="attribution">
      <div class="pill">
        <div class="avatar">{{INIZIALE}}</div>
        <div class="name">{{NOME}}</div>
      </div>
    </div>
  </div>
  <div class="annotazione">{{ANNOTAZIONE}}</div>
  <div class="footer">
    <div class="counter">{{CONTATORE}}</div>
    <div class="swipe">scorri &rarr;</div>
  </div>
</body>
</html>
